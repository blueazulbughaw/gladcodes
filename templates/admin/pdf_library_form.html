{% extends "admin/_shell.html" %}

{% block title %}{{ 'Edit PDF' if asset else 'Upload PDF' }}{% endblock %}

{% block content %}
<div class="container">
  <div class="admin-page-header"><h1>{{ 'Edit PDF' if asset else 'Upload PDF' }}</h1></div>
  {% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="admin-field"><span>Title</span><input type="text" name="title" value="{{ asset.title if asset else '' }}" required></label>
    <label class="admin-field"><span>Description</span><textarea name="description" rows="3">{{ asset.description if asset else '' }}</textarea></label>
    <label class="admin-field">
      <span>PDF file{{ ' (upload to replace)' if asset and asset.file_path else '' }}</span>
      <input type="file" name="pdf_file" accept="application/pdf"{{ '' if asset else ' required' }}>
      {% if asset and asset.file_path %}<small>Current: {{ asset.file_path }}</small>{% endif %}
    </label>
    <label class="admin-field">
      <span>This is a paid product</span>
      <input type="checkbox" name="is_product" {{ 'checked' if asset and asset.is_product }}>
    </label>
    <label class="admin-field"><span>Price (USD, only used if marked as a paid product)</span><input type="number" step="0.01" name="price" value="{{ asset.price if asset and asset.price is not none else '' }}"></label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <a class="admin-back-link" href="{{ url_for('admin.pdf_library_index') }}">&larr; Back to PDF Library</a>
</div>
{% endblock %}
