{% extends "admin/_shell.html" %}
{% import "admin/_form_macros.html" as fm %}

{% block title %}Add — {{ config.title }}{% endblock %}

{% block content %}
<div class="container">
  <div class="admin-page-header"><h1>Add {{ config.title }}</h1></div>
  <form method="post" action="{{ url_for('admin.simple_create', resource=resource) }}" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {{ fm.render_fields(config, icon_choices) }}
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
  <a class="admin-back-link" href="{{ url_for('admin.simple_list', resource=resource) }}">&larr; Back to {{ config.title }}</a>
</div>
{% endblock %}
