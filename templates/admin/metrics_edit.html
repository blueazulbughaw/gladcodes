{% extends "admin/_shell.html" %}

{% block title %}Edit metric entry{% endblock %}

{% block content %}
<div class="container">
  <div class="admin-page-header"><h1>Edit metric entry</h1></div>
  <form method="post" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="admin-field"><span>Label</span><input type="text" name="period_label" value="{{ row.period_label }}"></label>
    <label class="admin-field"><span>Value</span><input type="number" step="0.01" name="value" value="{{ row.value }}"></label>
    <label class="admin-field"><span>Sort order</span><input type="number" name="sort_order" value="{{ row.sort_order }}"></label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
  <a class="admin-back-link" href="{{ url_for('admin.metrics_index') }}">&larr; Back to Metrics</a>
</div>
{% endblock %}
