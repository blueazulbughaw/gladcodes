{% extends "admin/_shell.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="container">
  <div class="admin-page-header"><h1>Settings</h1></div>
  {% if error %}<p class="admin-error">{{ error }}</p>{% endif %}
  <form method="post" enctype="multipart/form-data" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% for key, label in fields %}
    <label class="admin-field">
      <span>{{ label }}</span>
      <input type="text" name="{{ key }}" value="{{ current.get(key, '') }}">
    </label>
    {% endfor %}
    <label class="admin-field">
      <span>Headshot photo{{ ' (upload to replace)' if current.get('headshot_image') else '' }}</span>
      <input type="file" name="headshot_image" accept="image/png,image/jpeg,image/webp,image/gif">
      {% if current.get('headshot_image') %}<small>Current: {{ current.get('headshot_image') }} — shown on the Let's Connect page.</small>{% endif %}
    </label>
    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
